{% include 'layout.html' %}
<div class="container">
    <div class="card">
        <div class="card-header">
            Register
        </div>
        <div class="card-body">
            <form id="registerForm">
                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label>Email</label>
                        <input class="form-control" name="email" required type="text"/>
                    </div>
                    <div class="form-group col-md-6">
                        <label>Username</label>
                        <input class="form-control" name="username" required type="text"/>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label>First Name</label>
                        <input class="form-control" name="firstname" required type="text"/>
                    </div>
                    <div class="form-group col-md-6">
                        <label>Last Name</label>
                        <input class="form-control" name="lastname" required type="text"/>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label>Rolee</label>
                        <input class="form-control" name="role" required type="text"/>
                    </div>
                    <div class="form-group col-md-6">
                        <label>Phone Number</label>
                        <input class="form-control" name="phone_number" autocomplete="phone_number" required
                               type="text"/>
                    </div>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" class="form-control" name="password" autocomplete="new-password" required>
                </div>
                <div class="form-group">
                    <label>Verify Password</label>
                    <input type="password" class="form-control" name="password2" autocomplete="new-password" required>
                </div>
                <button type="submit" class="btn btn-primary">Sign in</button>
            </form>
        </div>
        <div class="card-footer text-muted">
            <a href="/auth/login-page">Already have an account?</a>
        </div>
    </div>
</div>
